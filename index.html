<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Planner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap');
  :root{
    --bg:#faf6ef;--surface:#ffffff;--surface2:#f2ede1;--border:#ddd3bd;--text:#241f1a;--text-muted:#8a7d68;
    --accent:#0f9d58;--accent-light:#e3f7ea;
    --amber:#f97316;--amber-light:#fef0e2;
    --red:#e11d48;
    --blue:#2563eb;--blue-light:#e8f0fc;
    --confidential:#9333ea;--confidential-light:#f3e8fd;
    --tomorrow:#0891b2;--tomorrow-light:#e0f5f8;
    --recurring:#db2777;--recurring-light:#fdf0f7
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
  #loadingOverlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Fraunces',serif;font-size:18px;color:var(--text-muted);z-index:100}
  .loading-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--text-muted);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #authScreen{display:none;max-width:300px;margin:60px auto;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
  .pin-header{padding:20px 20px 14px;border-bottom:1.5px solid var(--border);background:var(--surface2);text-align:center}
  .pin-header h1{font-family:'Fraunces',serif;font-size:20px;font-weight:600}
  .pin-header p{font-size:11px;color:var(--text-muted);margin-top:3px}
  .pin-body{padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px}
  .pin-dots{display:flex;gap:14px}
  .pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:white;transition:all .15s}
  .pin-dot.filled{background:var(--text);border-color:var(--text)}
  .pin-dot.error{background:var(--red);border-color:var(--red);animation:shake .4s ease}
  .pin-dot.success{background:var(--accent);border-color:var(--accent)}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .pin-keypad{display:grid;grid-template-columns:repeat(3,62px);gap:8px}
  .pin-key{width:62px;height:62px;font-family:'Fraunces',serif;font-size:22px;font-weight:600;border:1.5px solid var(--border);border-radius:6px;background:white;cursor:pointer;color:var(--text);transition:all .1s;display:flex;align-items:center;justify-content:center;user-select:none}
  .pin-key:hover{background:var(--surface2);border-color:var(--text)}
  .pin-key:active{background:var(--text);color:white;transform:scale(.95)}
  .pin-key.del{font-size:16px;color:var(--text-muted)}
  .pin-key.empty{border:none;background:transparent;cursor:default;pointer-events:none}
  .pin-msg{font-size:11px;text-align:center;min-height:16px;color:var(--text-muted)}
  .pin-msg.error{color:var(--red)}
  .pin-msg.success{color:var(--accent)}
  #appScreen{display:none}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid var(--text);flex-wrap:wrap}
  header h1{font-family:'Fraunces',serif;font-size:28px;font-weight:600;letter-spacing:-.5px}
  .header-date{font-size:12px;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;flex:1}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:5px}
  .sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}
  .sync-dot.error{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .sync-label{font-size:10px;color:var(--text-muted);display:flex;align-items:center}
  .signout-btn{font-family:'DM Mono',monospace;font-size:10px;padding:4px 10px;border:1px solid var(--border);border-radius:3px;background:white;cursor:pointer;color:var(--text-muted)}
  .signout-btn:hover{border-color:var(--red);color:var(--red)}
  .tab-nav{display:flex;flex-wrap:wrap;border:1.5px solid var(--border);border-radius:4px;background:var(--surface2);margin-bottom:16px}
  .tab-btn{flex:1;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:10px 4px;border:none;border-right:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-muted);transition:all .15s}
  .tab-btn:hover{background:var(--surface);color:var(--text)}
  .tab-btn.active{background:var(--surface);color:var(--text)}
  .tab-btn.active.tab-today{box-shadow:inset 0 -2px 0 var(--blue)}
  .tab-btn.active.tab-tomorrow{box-shadow:inset 0 -2px 0 var(--tomorrow)}
  .tab-add-btn{flex-shrink:0;width:38px;font-family:'DM Mono',monospace;font-size:16px;border:none;border-left:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-muted);border-radius:0 4px 4px 0}
  .tab-add-btn:hover{background:var(--surface);color:var(--text)}
  .tab-pane{display:none;flex-direction:column;gap:16px}
  .tab-pane.active{display:flex}
  .layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
  .left-col{min-width:0}
  .right-col{display:flex;flex-direction:column;gap:16px}
  .panel{background:var(--surface);border:1.5px solid var(--border);border-radius:4px;overflow:hidden}
  .panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1.5px solid var(--border);background:var(--surface2);gap:8px;flex-wrap:wrap}
  .panel-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);display:flex;align-items:center;gap:8px;flex-shrink:0}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot-today{background:var(--blue)}.dot-new{background:var(--red)}
  .dot-tomorrow{background:var(--tomorrow)}
  .dot-amber{background:var(--amber)}.dot-accent{background:var(--accent)}.dot-blue{background:var(--blue)}
  .section{padding:14px 16px;border-bottom:1px solid var(--border)}
  .section:last-child{border-bottom:none}
  .task-list{display:flex;flex-direction:column;gap:6px}
  .task-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:3px;border:1px solid transparent;transition:all .15s}
  .task-item:hover{background:var(--surface2);border-color:var(--border)}
  .task-item.done{opacity:.5}
  .task-item.done .task-text{text-decoration:line-through;color:var(--text-muted)}
  .task-item.confidential{background:var(--confidential-light);border-color:#d4b8e8}
  .task-item.carried{background:var(--amber-light);border-color:#e8c87a}
  .task-check{width:16px;height:16px;border:1.5px solid var(--border);border-radius:2px;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:white}
  .task-check:hover{border-color:var(--accent)}
  .task-check.checked{background:var(--accent);border-color:var(--accent)}
  .task-check.checked::after{content:'v';color:white;font-size:10px;line-height:1}
  .task-text{font-size:13px;line-height:1.4;flex:1;word-break:break-word}
  .task-tag{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;padding:2px 5px;border-radius:2px;flex-shrink:0;margin-top:2px}
  .tag-conf{background:var(--confidential-light);color:var(--confidential);border:1px solid #c9a8e0}
  .tag-carried{background:var(--amber-light);color:var(--amber);border:1px solid #e8c87a}
  .task-actions{display:flex;gap:3px;flex-shrink:0;opacity:0;transition:opacity .15s}
  .task-item:hover .task-actions{opacity:1}
  .task-btn{font-size:10px;padding:2px 5px;border:1px solid var(--border);border-radius:2px;background:white;cursor:pointer;color:var(--text-muted);font-family:inherit;transition:all .12s;white-space:nowrap}
  .task-btn:hover{border-color:var(--text);color:var(--text)}
  .task-btn.danger:hover{border-color:var(--red);color:var(--red)}
  .task-btn.promote:hover{border-color:var(--accent);color:var(--accent)}
  .recurring-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:3px;border:1px solid #e0cfa0;background:var(--recurring-light)}
  .rec-btn{font-size:10px;padding:3px 7px;border:1.5px solid;border-radius:2px;background:white;cursor:pointer;font-family:inherit;font-weight:500;transition:all .12s;white-space:nowrap;flex-shrink:0}
  .rec-btn.to-today{border-color:var(--blue);color:var(--blue)}
  .rec-btn.to-today:hover{background:var(--blue);color:white}
  .rec-btn.to-tmrw{border-color:var(--tomorrow);color:var(--tomorrow)}
  .rec-btn.to-tmrw:hover{background:var(--tomorrow);color:white}
  .add-area{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .add-input{flex:1;font-family:'DM Mono',monospace;font-size:12px;padding:7px 10px;border:1.5px solid var(--border);border-radius:3px;background:white;color:var(--text);outline:none;transition:border-color .15s;min-width:0}
  .add-input:focus{border-color:var(--text)}
  .add-input::placeholder{color:var(--text-muted)}
  .add-btn{font-family:'DM Mono',monospace;font-size:11px;padding:7px 12px;background:var(--text);color:white;border:none;border-radius:3px;cursor:pointer;transition:opacity .15s;white-space:nowrap}
  .add-btn:hover{opacity:.8}
  .conf-label{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);cursor:pointer;padding:4px 0;user-select:none;flex-shrink:0}
  .conf-label input{cursor:pointer;accent-color:var(--confidential)}
  .post-content{padding:14px 16px}
  .post-box{font-family:'DM Mono',monospace;font-size:11px;line-height:1.7;background:var(--surface2);border:1.5px solid var(--border);border-radius:3px;padding:12px;min-height:70px;white-space:pre-wrap;word-break:break-word;color:var(--text);max-height:200px;overflow-y:auto}
  .copy-btn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-family:'DM Mono',monospace;font-size:11px;padding:8px 14px;background:var(--text);color:white;border:none;border-radius:3px;cursor:pointer;transition:all .15s;width:100%}
  .copy-btn:hover{opacity:.8}
  .copy-btn.copied{background:var(--accent)!important}
  .start-btn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-family:'DM Mono',monospace;font-size:11px;padding:8px 14px;background:var(--tomorrow);color:white;border:none;border-radius:3px;cursor:pointer;transition:opacity .15s;width:100%}
  .start-btn:hover{opacity:.85}
  .stats-row{display:flex;padding:12px 16px;background:var(--surface2)}
  .stat{flex:1;text-align:center}
  .stat-num{font-size:20px;font-family:'Fraunces',serif;font-weight:600;line-height:1;margin-bottom:2px}
  .stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
  .c-done{color:var(--accent)}.c-today{color:var(--blue)}.c-tmrw{color:var(--tomorrow)}.c-backlog{color:var(--amber)}
  .empty-state{font-size:11px;color:var(--text-muted);text-align:center;padding:12px 0;font-style:italic}
  .notice{font-size:10px;padding:8px 10px;border-radius:3px;line-height:1.55;margin-top:10px}
  .n-conf{background:var(--confidential-light);color:var(--confidential);border:1px solid #d4b8e8}
  .n-tmrw{background:var(--tomorrow-light);color:var(--tomorrow);border:1px solid #b0cfcf}
  .n-rec{background:var(--recurring-light);color:var(--recurring);border:1px solid #f0b8d4}
  .n-amber{background:var(--amber-light);color:var(--amber);border:1px solid #e8c87a}
  .header-btns{display:flex;gap:6px;flex-wrap:wrap}
  .hdr-btn{font-family:'DM Mono',monospace;font-size:10px;padding:3px 8px;border:1px solid var(--border);border-radius:2px;background:white;cursor:pointer;color:var(--text-muted);transition:all .12s;white-space:nowrap}
  .hdr-btn:hover{border-color:var(--text);color:var(--text)}
  .list-type-badge{font-size:9px;color:var(--text-muted);text-transform:none;letter-spacing:0;font-weight:400}
  .tag-schedule{background:var(--amber-light);color:var(--amber);border:1px solid #f3c98a;cursor:pointer;font-size:9px;padding:2px 6px;border-radius:2px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;font-family:inherit}
  .tag-schedule:hover{opacity:.75}
  @media(max-width:820px){body{padding:16px}.layout{grid-template-columns:1fr}.right-col{order:-1}}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="loading-spinner"></div>
  <span>Loading...</span>
</div>

<div id="authScreen">
  <div class="pin-header">
    <h1>Daily Planner</h1>
    <p id="pinSubtitle">Enter your PIN</p>
  </div>
  <div class="pin-body">
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-msg" id="pinMsg"></div>
    <div class="pin-keypad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>
      <button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button>
      <button class="pin-key" onclick="pinPress('5')">5</button>
      <button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button>
      <button class="pin-key" onclick="pinPress('8')">8</button>
      <button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key empty"></button>
      <button class="pin-key" onclick="pinPress('0')">0</button>
      <button class="pin-key del" onclick="pinDel()">&#9003;</button>
    </div>
  </div>
</div>

<div id="appScreen">
  <header>
    <h1>Daily Planner</h1>
    <span class="header-date" id="dateDisplay"></span>
    <span class="sync-label"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Synced</span></span>
    <button class="signout-btn" onclick="signOut()">Lock &#128274;</button>
  </header>
  <div class="layout">
    <div class="left-col">
      <div class="tab-nav" id="tabNav">
        <button class="tab-btn tab-today active" id="tabbtn-today" onclick="switchTab('today')">Today</button>
        <button class="tab-btn tab-tomorrow" id="tabbtn-tomorrow" onclick="switchTab('tomorrow')">Tomorrow</button>
        <span id="listTabsContainer" style="display:contents"></span>
        <button class="tab-add-btn" onclick="addNewList()" title="Add a list">+</button>
      </div>
      <div class="tab-pane active" id="pane-today">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title"><span class="dot dot-today"></span>Planned for today</span>
            <div class="header-btns">
              <button class="hdr-btn" onclick="pullFromAnyList('today')">+ From a list</button>
            </div>
          </div>
          <div class="section">
            <div class="task-list" id="todayList"></div>
            <div class="add-area">
              <input class="add-input" id="todayInput" placeholder="Add a task for today..." onkeydown="if(event.key==='Enter')addTask('today')">
              <label class="conf-label"><input type="checkbox" id="todayConf"> &#128274;</label>
              <button class="add-btn" onclick="addTask('today')">+ Add</button>
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header"><span class="panel-title"><span class="dot dot-new"></span>Added during the day</span></div>
          <div class="section">
            <div class="task-list" id="newList"></div>
            <div class="add-area">
              <input class="add-input" id="newInput" placeholder="Something that came up today..." onkeydown="if(event.key==='Enter')addTask('new')">
              <label class="conf-label"><input type="checkbox" id="newConf"> &#128274;</label>
              <button class="add-btn" onclick="addTask('new')">+ Add</button>
            </div>
          </div>
        </div>
      </div>
      <div class="tab-pane" id="pane-tomorrow">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title"><span class="dot dot-tomorrow"></span>Tomorrow's plan (draft)</span>
            <div class="header-btns">
              <button class="hdr-btn" onclick="carryForward()">+ Carry forward unfinished</button>
              <button class="hdr-btn" onclick="pullFromAnyList('tomorrow')">+ From a list</button>
            </div>
          </div>
          <div class="section">
            <div class="task-list" id="tomorrowList"></div>
            <div class="add-area">
              <input class="add-input" id="tomorrowInput" placeholder="Plan a task for tomorrow..." onkeydown="if(event.key==='Enter')addTask('tomorrow')">
              <label class="conf-label"><input type="checkbox" id="tomorrowConf"> &#128274;</label>
              <button class="add-btn" onclick="addTask('tomorrow')">+ Add</button>
            </div>
            <div class="notice n-tmrw" style="margin-top:12px">Separate from today. Hit Start Tomorrow on the right when your new day begins.</div>
          </div>
        </div>
      </div>
      <div id="listPanesContainer"></div>
    </div>
    <div class="right-col">
      <div class="panel">
        <div class="stats-row">
          <div class="stat"><div class="stat-num c-today" id="statToday">0</div><div class="stat-label">Today</div></div>
          <div class="stat"><div class="stat-num c-done"  id="statDone">0</div><div class="stat-label">Done</div></div>
          <div class="stat"><div class="stat-num c-tmrw"  id="statTmrw">0</div><div class="stat-label">Tmrw</div></div>
          <div class="stat"><div class="stat-num c-backlog" id="statBacklog">0</div><div class="stat-label">Lists</div></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Morning Stand-up</span></div>
        <div class="post-content">
          <div class="post-box" id="morningPost"></div>
          <button class="copy-btn" id="morningCopyBtn" onclick="copyPost('morning')">Copy for Teams</button>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">End of Day</span></div>
        <div class="post-content">
          <div class="post-box" id="eodPost"></div>
          <button class="copy-btn" id="eodCopyBtn" onclick="copyPost('eod')">Copy for Teams</button>
        </div>
      </div>
      <div class="panel" style="border-color:#b0cfcf">
        <div class="panel-header" style="background:#edf5f5">
          <span class="panel-title" style="color:var(--tomorrow)">Tomorrow's Stand-up (draft)</span>
        </div>
        <div class="post-content">
          <div class="post-box" id="tomorrowPost" style="border-color:#b0cfcf;background:#edf5f5"></div>
          <button class="copy-btn" id="tomorrowCopyBtn" onclick="copyPost('tomorrow')" style="background:var(--tomorrow)">Copy for Teams</button>
          <button class="start-btn" onclick="startTomorrow()">Start Tomorrow - move to Today</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL      = 'https://yqeohnvtdxjvufskusff.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxZW9obnZ0ZHhqdnVmc2t1c2ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTQ1NTMsImV4cCI6MjA5MzU3MDU1M30.Wh_MD8rJ5z0dfdfj_v8wZjt3W0IDIawzxov0muRfTEo';
const APP_KEY    = 'dailytasks_v1';
const PIN_STORE  = 'dtm_pin_v1';
const FIXED_UID  = '3d7ff7f8-c7c1-420e-ab0a-418862cf779e';
const FIXED_EMAIL= 'sian.fussell@gmail.com';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var tasks=[],ongoingItems=[],lists=[];
var currentTab='today';
var pinBuffer='',pinSetupFirst='',pinMode='enter';
var LIST_COLORS=['#db2777','#0891b2','#f97316','#7c3aed','#0f9d58','#eab308','#e11d48','#2563eb'];
function colorForList(i){return LIST_COLORS[i % LIST_COLORS.length];}

document.getElementById('dateDisplay').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function setSyncState(s){
  document.getElementById('syncDot').className='sync-dot'+(s==='syncing'?' syncing':s==='error'?' error':'');
  document.getElementById('syncLabel').textContent=s==='syncing'?'Saving...':s==='error'?'Error':'Synced';
}

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function updateDots(state){
  for(var i=0;i<4;i++){
    var d=document.getElementById('pd'+i);
    d.className='pin-dot';
    if(state==='error')d.classList.add('error');
    else if(state==='success')d.classList.add('success');
    else if(i<pinBuffer.length)d.classList.add('filled');
  }
}

function pinPress(digit){
  if(pinBuffer.length>=4)return;
  pinBuffer+=digit; updateDots();
  if(pinBuffer.length===4)setTimeout(handlePin,120);
}
function pinDel(){if(pinBuffer.length>0){pinBuffer=pinBuffer.slice(0,-1);updateDots();}}

async function handlePin(){
  var storedHash=localStorage.getItem(PIN_STORE);
  if(!storedHash){
    if(pinMode==='enter'){
      pinMode='setup_first'; pinSetupFirst=pinBuffer; pinBuffer=''; updateDots();
      document.getElementById('pinSubtitle').textContent='Confirm your PIN';
      document.getElementById('pinMsg').textContent='Enter the same PIN again to confirm.';
      document.getElementById('pinMsg').className='pin-msg';
      return;
    }
    if(pinMode==='setup_first'){
      if(pinBuffer!==pinSetupFirst){
        updateDots('error');
        document.getElementById('pinMsg').textContent="PINs don't match - try again.";
        document.getElementById('pinMsg').className='pin-msg error';
        setTimeout(function(){pinBuffer='';pinSetupFirst='';pinMode='enter';updateDots();document.getElementById('pinSubtitle').textContent='Choose a 4-digit PIN';document.getElementById('pinMsg').textContent='';document.getElementById('pinMsg').className='pin-msg';},1400);
        return;
      }
      var hash=await sha256(pinBuffer+APP_KEY);
      localStorage.setItem(PIN_STORE,hash);
      updateDots('success');
      document.getElementById('pinMsg').textContent='PIN set! Loading...';
      document.getElementById('pinMsg').className='pin-msg success';
      await signInToSupabase(pinBuffer);
      return;
    }
  }
  var hash=await sha256(pinBuffer+APP_KEY);
  if(hash!==storedHash){
    updateDots('error');
    document.getElementById('pinMsg').textContent='Incorrect PIN.';
    document.getElementById('pinMsg').className='pin-msg error';
    pinBuffer='';
    setTimeout(function(){updateDots();document.getElementById('pinMsg').textContent='';document.getElementById('pinMsg').className='pin-msg';},1200);
    return;
  }
  updateDots('success');
  await signInToSupabase(pinBuffer);
}

async function signInToSupabase(pin){
  var password=pin+'_'+APP_KEY;
  var res=await sb.auth.signInWithPassword({email:FIXED_EMAIL,password:password});
  if(res.error){
    var res2=await sb.auth.signUp({email:FIXED_EMAIL,password:password});
    if(res2.error){
      document.getElementById('pinMsg').textContent='Auth error: '+res2.error.message;
      document.getElementById('pinMsg').className='pin-msg error';
      pinBuffer='';updateDots();return;
    }
  }
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  loadData();
}

async function signOut(){

  document.getElementById('pinMsg').textContent='';document.getElementById('pinMsg').className='pin-msg';

async function loadData(){
  setSyncState('syncing');
  try{
    var r=await Promise.all([
      sb.from('tasks').select('*').eq('user_id',FIXED_UID).order('created_at'),
      sb.from('recurring').select('*').eq('user_id',FIXED_UID).order('created_at'),
      sb.from('lists').select('*').eq('user_id',FIXED_UID).order('sort_order',{ascending:true})
    ]);
    tasks=r[0].data||[];ongoingItems=r[1].data||[];lists=r[2].data||[];
    setSyncState('synced');
  }catch(e){setSyncState('error');console.error(e);}
  await migrateLegacyData();
  await autoAddScheduledTasks();
  render();
}

// Auto-adds "daily" and "this weekday" ongoing items into Today, once per calendar day.
function todayDateStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
async function autoAddScheduledTasks(){
  var today=todayDateStr(),dow=new Date().getDay();
  var due=ongoingItems.filter(function(r){
    if(!r.schedule||r.last_added_date===today)return false;
    if(r.schedule==='daily')return true;
    if(r.schedule.indexOf('weekly:')===0)return parseInt(r.schedule.split(':')[1],10)===dow;
    if(r.schedule.indexOf('biweekly:')===0){
      var p=r.schedule.split(':'),schedDow=parseInt(p[1],10),anchor=p[2];
      if(schedDow!==dow)return false;
      var anchorDate=new Date(anchor+'T00:00:00'),todayDate=new Date(today+'T00:00:00');
      var diffDays=Math.round((todayDate-anchorDate)/86400000);
      return diffDays>=0&&diffDays%14===0;
    }
    return false;
  });
  if(!due.length)return;
  setSyncState('syncing');
  for(var r of due){
    var alreadyThere=tasks.some(function(t){return t.bucket==='today'&&t.text===r.text&&!t.done;});
    if(!alreadyThere){
      var saved=await dbInsertTask({text:r.text,bucket:'today',done:false,confidential:false});
      if(saved)tasks.push(saved);
    }
    r.last_added_date=today;
    await sb.from('recurring').update({last_added_date:today}).eq('id',r.id).eq('user_id',FIXED_UID);
  }
  setSyncState('synced');
}

// One-time migration: turns the old fixed "Ongoing" and "Other" tabs into
// rows in the new `lists` table, and moves existing items across.
// Requires the `lists` table and `recurring.list_id` column to exist in Supabase.
async function migrateLegacyData(){
  if(lists.length>0)return;
  var hasLegacyBacklog=tasks.some(function(t){return t.bucket==='backlog'});
  if(!hasLegacyBacklog && !ongoingItems.length)return;
  setSyncState('syncing');
  try{
    var ongoingRes=await sb.from('lists').insert({user_id:FIXED_UID,name:'Ongoing',type:'ongoing',sort_order:0}).select().single();
    var otherRes=await sb.from('lists').insert({user_id:FIXED_UID,name:'Other',type:'checklist',sort_order:1}).select().single();
    if(ongoingRes.error||otherRes.error){setSyncState('error');console.error('Migration failed - have you run the lists SQL yet?',ongoingRes.error||otherRes.error);return;}
    lists.push(ongoingRes.data,otherRes.data);
    var ongoingId=ongoingRes.data.id,otherId=otherRes.data.id;
    if(ongoingItems.length){
      await sb.from('recurring').update({list_id:ongoingId}).eq('user_id',FIXED_UID).is('list_id',null);
      ongoingItems.forEach(function(o){o.list_id=ongoingId;});
    }
    if(hasLegacyBacklog){
      await sb.from('tasks').update({bucket:otherId}).eq('user_id',FIXED_UID).eq('bucket','backlog');
      tasks.forEach(function(t){if(t.bucket==='backlog')t.bucket=otherId;});
    }
    setSyncState('synced');
  }catch(e){setSyncState('error');console.error('Migration failed',e);}
}

async function dbInsertTask(t){setSyncState('syncing');var res=await sb.from('tasks').insert({user_id:FIXED_UID,text:t.text,bucket:t.bucket,done:t.done,confidential:t.confidential}).select().single();setSyncState(res.error?'error':'synced');return res.data;}
async function dbUpdateTask(id,c){setSyncState('syncing');await sb.from('tasks').update(c).eq('id',id).eq('user_id',FIXED_UID);setSyncState('synced');}
async function dbDeleteTask(id){setSyncState('syncing');await sb.from('tasks').delete().eq('id',id).eq('user_id',FIXED_UID);setSyncState('synced');}

function switchTab(tabId){
  currentTab=tabId;
  document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');if(b.dataset.color)b.style.boxShadow='';});
  var pane=document.getElementById('pane-'+tabId);if(pane)pane.classList.add('active');
  var btn=document.getElementById('tabbtn-'+tabId);
  if(btn){btn.classList.add('active');if(btn.dataset.color)btn.style.boxShadow='inset 0 -2px 0 '+btn.dataset.color;}
}

async function addTask(bucket){
  var input=document.getElementById(bucket+'Input'),confEl=document.getElementById(bucket+'Conf');
  var text=input.value.trim();if(!text)return;
  input.value='';var isConf=confEl?confEl.checked:false;if(confEl)confEl.checked=false;
  var tmp='tmp_'+Date.now();tasks.push({id:tmp,text:text,bucket:bucket,done:false,confidential:isConf});render();
  var saved=await dbInsertTask({text:text,bucket:bucket,done:false,confidential:isConf});
  if(saved){tasks=tasks.filter(function(t){return t.id!==tmp});tasks.push(saved);render();}
}
async function toggleDone(id){var t=tasks.find(function(x){return x.id===id});if(!t)return;t.done=!t.done;render();await dbUpdateTask(id,{done:t.done});}
async function moveTask(id,bucket){var t=tasks.find(function(x){return x.id===id});if(!t)return;t.bucket=bucket;t.done=false;render();await dbUpdateTask(id,{bucket:bucket,done:false});}
async function deleteTask(id){tasks=tasks.filter(function(x){return x.id!==id});render();await dbDeleteTask(id);}

async function pullFromAnyList(dest){
  var entries=[];
  lists.forEach(function(l){
    if(l.type==='checklist'){
      tasks.filter(function(t){return t.bucket===l.id}).forEach(function(t){
        entries.push({label:l.name+': '+(t.confidential?'[private] ':'')+t.text,kind:'move',id:t.id});
      });
    }else{
      ongoingItems.filter(function(o){return o.list_id===l.id}).forEach(function(o){
        entries.push({label:l.name+' (ongoing): '+o.text,kind:'copy',id:o.id});
      });
    }
  });
  if(!entries.length){alert('No items in your lists yet!');return;}
  var listing=entries.map(function(e,i){return(i+1)+'. '+e.label;}).join('\n');
  var ans=prompt('Pull into '+dest+':\n\n'+listing+'\n\nEnter number:');if(!ans)return;
  var idx=parseInt(ans)-1;if(idx<0||idx>=entries.length)return;
  var e=entries[idx];
  if(e.kind==='move')moveTask(e.id,dest);else copyOngoingTo(e.id,dest);
}
async function carryForward(){
  var u=tasks.filter(function(t){return t.bucket==='today'&&!t.done});if(!u.length){alert('No unfinished tasks today!');return;}
  for(var t of u){var tmp='tmp_'+Date.now()+Math.random();tasks.push({id:tmp,text:t.text,bucket:'tomorrow',done:false,confidential:t.confidential});render();var saved=await dbInsertTask({text:t.text,bucket:'tomorrow',done:false,confidential:t.confidential});if(saved){tasks=tasks.filter(function(x){return x.id!==tmp});tasks.push(saved);}}
  render();switchTab('tomorrow');
}
async function startTomorrow(){
  var tmrw=tasks.filter(function(t){return t.bucket==='tomorrow'});
  if(!tmrw.length&&!confirm('No tasks planned for tomorrow yet. Start fresh day anyway?'))return;
  var toDelete=tasks.filter(function(t){return t.done||t.bucket==='new'}).map(function(t){return t.id});
  tasks=tasks.filter(function(t){return!t.done&&t.bucket!=='new'});
  tasks.filter(function(t){return t.bucket==='today'}).forEach(function(t){t.done=false;});
  tasks.filter(function(t){return t.bucket==='tomorrow'}).forEach(function(t){t.bucket='today';t.done=false;});
  render();switchTab('today');setSyncState('syncing');
  for(var id of toDelete){if(!String(id).startsWith('tmp_'))await sb.from('tasks').delete().eq('id',id).eq('user_id',FIXED_UID);}
  for(var t of tasks.filter(function(x){return x.bucket==='today'})){if(!String(t.id).startsWith('tmp_'))await dbUpdateTask(t.id,{bucket:'today',done:false});}
  setSyncState('synced');
}

  var isOngoing=confirm('OK = Ongoing list (permanent items you copy across each day)\nCancel = To-do list (checkable tasks you tick off)');

  currentTab='list-'+res.data.id;

}
async function renameList(listId){
  var list=lists.find(function(l){return l.id===listId});if(!list)return;
  var name=prompt('Rename list:',list.name);if(!name||!name.trim())return;
  list.name=name.trim();render();
  setSyncState('syncing');await sb.from('lists').update({name:list.name}).eq('id',listId).eq('user_id',FIXED_UID);setSyncState('synced');
}
async function deleteList(listId){
  var list=lists.find(function(l){return l.id===listId});if(!list)return;
  if(!confirm('Delete "'+list.name+'" and everything in it? This can\'t be undone.'))return;
  setSyncState('syncing');
  if(list.type==='checklist'){
    tasks=tasks.filter(function(t){return t.bucket!==listId});
    await sb.from('tasks').delete().eq('bucket',listId).eq('user_id',FIXED_UID);
  }else{
    ongoingItems=ongoingItems.filter(function(o){return o.list_id!==listId});
    await sb.from('recurring').delete().eq('list_id',listId).eq('user_id',FIXED_UID);
  }
  lists=lists.filter(function(l){return l.id!==listId});
  await sb.from('lists').delete().eq('id',listId).eq('user_id',FIXED_UID);
  setSyncState('synced');
  if(currentTab==='list-'+listId)currentTab='today';
  render();
}

var WEEKDAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function promptForSchedule(defaultChoice){
  var choice=prompt('When should this repeat?\n\n1 = Every day (auto-added to Today)\n2 = A specific day each week (auto-added to Today)\n3 = Manual only (you click Today/Tomorrow yourself)\n4 = Every other week (auto-added to Today)\n\nEnter 1, 2, 3 or 4:',defaultChoice||'3');
  if(choice===null)return undefined;
  if(choice==='1')return 'daily';
  if(choice==='2'){
    var d=prompt('Which day of the week?\n\n0 = Sunday\n1 = Monday\n2 = Tuesday\n3 = Wednesday\n4 = Thursday\n5 = Friday\n6 = Saturday\n\nEnter 0-6:','1');
    if(d===null)return undefined;
    var dn=parseInt(d,10);
    if(isNaN(dn)||dn<0||dn>6){alert('Please enter a number 0-6. No repeat set - you can add one later by clicking the badge on the item.');return null;}
    return 'weekly:'+dn;
  }
  if(choice==='4'){
    var d2=prompt('Which day of the week does it fall on?\n\n0 = Sunday\n1 = Monday\n2 = Tuesday\n3 = Wednesday\n4 = Thursday\n5 = Friday\n6 = Saturday\n\nEnter 0-6:','1');
    if(d2===null)return undefined;
    var dn2=parseInt(d2,10);
    if(isNaN(dn2)||dn2<0||dn2>6){alert('Please enter a number 0-6. No repeat set - you can add one later by clicking the badge on the item.');return null;}
    var anchor=prompt('Enter any ONE date this meeting falls on (a date it actually happens), as YYYY-MM-DD - e.g. the next occurrence:');
    if(anchor===null)return undefined;
    anchor=anchor.trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(anchor)){alert('Please use the format YYYY-MM-DD, e.g. 2026-08-17. No repeat set - you can add one later by clicking the badge on the item.');return null;}
    return 'biweekly:'+dn2+':'+anchor;
  }
  return null;
}
async function addOngoingItem(listId){
  var input=document.getElementById('ongoingInput-'+listId);var text=input.value.trim();if(!text)return;input.value='';
  var schedule=promptForSchedule('3');
  if(schedule===undefined)return;
  var tmp='tmp_'+Date.now();ongoingItems.push({id:tmp,text:text,list_id:listId,schedule:schedule,last_added_date:null});render();
  setSyncState('syncing');var res=await sb.from('recurring').insert({user_id:FIXED_UID,text:text,list_id:listId,schedule:schedule,last_added_date:null}).select().single();setSyncState(res.error?'error':'synced');
  if(res.data){ongoingItems=ongoingItems.filter(function(o){return o.id!==tmp});ongoingItems.push(res.data);render();}
}
async function editSchedule(id){
  var r=ongoingItems.find(function(x){return x.id===id});if(!r)return;
  var defaultChoice=r.schedule==='daily'?'1':(r.schedule&&r.schedule.indexOf('biweekly:')===0)?'4':(r.schedule?'2':'3');
  var schedule=promptForSchedule(defaultChoice);
  if(schedule===undefined)return;
  r.schedule=schedule;r.last_added_date=null;render();
  setSyncState('syncing');await sb.from('recurring').update({schedule:schedule,last_added_date:null}).eq('id',id).eq('user_id',FIXED_UID);setSyncState('synced');
}
async function copyOngoingTo(id,bucket){
  var r=ongoingItems.find(function(x){return x.id===id});if(!r)return;
  var btn=document.getElementById('rb-'+id+'-'+bucket);if(btn){btn.textContent='Done';btn.disabled=true;}
  var tmp='tmp_'+Date.now();tasks.push({id:tmp,text:r.text,bucket:bucket,done:false,confidential:false});render();
  var saved=await dbInsertTask({text:r.text,bucket:bucket,done:false,confidential:false});
  if(saved){tasks=tasks.filter(function(t){return t.id!==tmp});tasks.push(saved);render();}
  if(btn)setTimeout(function(){btn.textContent=bucket==='today'?'Today':'Tomorrow';btn.disabled=false;},1600);
}
async function deleteOngoingItem(id){
  if(!confirm('Remove this item?'))return;
  ongoingItems=ongoingItems.filter(function(x){return x.id!==id});render();
  setSyncState('syncing');await sb.from('recurring').delete().eq('id',id).eq('user_id',FIXED_UID);setSyncState('synced');
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderTaskList(cid,bucket){
  var el=document.getElementById(cid);var list=tasks.filter(function(t){return t.bucket===bucket});
  if(!list.length){el.innerHTML='<div class="empty-state">No tasks yet</div>';return;}
  el.innerHTML=list.map(function(t){
    var mv='';
    if(bucket==='today'||bucket==='new'){mv='<button class="task-btn" onclick="moveTask(\''+t.id+'\',\'tomorrow\')">tmrw</button>';}
    else if(bucket==='tomorrow'){mv='<button class="task-btn promote" onclick="moveTask(\''+t.id+'\',\'today\')">today</button>';}
    return '<div class="task-item'+(t.done?' done':'')+(t.confidential?' confidential':'')+'">'+'<div class="task-check'+(t.done?' checked':'')+'" onclick="toggleDone(\''+t.id+'\')"></div>'+'<span class="task-text">'+esc(t.text)+'</span>'+(t.confidential?'<span class="task-tag tag-conf">private</span>':'')+'<div class="task-actions">'+mv+'<button class="task-btn danger" onclick="deleteTask(\''+t.id+'\')">x</button></div></div>';
  }).join('');
}

function buildListPaneHtml(list,color){
  var active=currentTab===('list-'+list.id);
  var body='';
  if(list.type==='ongoing'){
    var items=ongoingItems.filter(function(o){return o.list_id===list.id});
    body+=items.length?items.map(function(r){
      var schedLabel='Manual';
      if(r.schedule==='daily')schedLabel='Every day';
      else if(r.schedule&&r.schedule.indexOf('weekly:')===0)schedLabel=WEEKDAY_NAMES[parseInt(r.schedule.split(':')[1],10)].slice(0,3);
      else if(r.schedule&&r.schedule.indexOf('biweekly:')===0){var bp=r.schedule.split(':');schedLabel=WEEKDAY_NAMES[parseInt(bp[1],10)].slice(0,3)+' (2wk)';}
      return `<div class="recurring-item"><span class="task-text">${esc(r.text)}</span>
      <button class="tag-schedule" onclick="editSchedule('${r.id}')" title="Click to change how often this repeats">${schedLabel}</button>
      <button class="rec-btn to-today" id="rb-${r.id}-today" onclick="copyOngoingTo('${r.id}','today')">Today</button>
      <button class="rec-btn to-tmrw" id="rb-${r.id}-tomorrow" onclick="copyOngoingTo('${r.id}','tomorrow')">Tomorrow</button>
      <button class="task-btn danger" style="opacity:.45" onclick="deleteOngoingItem('${r.id}')">x</button></div>`;
    }).join(''):'<div class="empty-state">Nothing here yet</div>';
    body+=`<div class="add-area" style="margin-top:12px"><input class="add-input" id="ongoingInput-${list.id}" placeholder="Add an item to ${esc(list.name)}..." onkeydown="if(event.key==='Enter')addOngoingItem('${list.id}')"><button class="add-btn" onclick="addOngoingItem('${list.id}')">+ Add</button></div>`;
    body+=`<div class="notice n-rec">Set "Every day", a weekday, or "every other week" and it'll auto-add itself to Today. Otherwise click Today or Tomorrow to copy it across yourself. Click the badge on any item to change its repeat.</div>`;
  }else{
    var titems=tasks.filter(function(t){return t.bucket===list.id});
    body+=titems.length?titems.map(function(t){
      return `<div class="task-item${t.done?' done':''}${t.confidential?' confidential':''}">
      <div class="task-check${t.done?' checked':''}" onclick="toggleDone('${t.id}')"></div>
      <span class="task-text">${esc(t.text)}</span>${t.confidential?'<span class="task-tag tag-conf">private</span>':''}
      <div class="task-actions"><button class="task-btn" onclick="moveTask('${t.id}','today')">today</button><button class="task-btn" onclick="moveTask('${t.id}','tomorrow')">tmrw</button><button class="task-btn danger" onclick="deleteTask('${t.id}')">x</button></div></div>`;
    }).join(''):'<div class="empty-state">No tasks yet</div>';
    body+=`<div class="add-area"><input class="add-input" id="listInput-${list.id}" placeholder="Add a task to ${esc(list.name)}..." onkeydown="if(event.key==='Enter')addListTask('${list.id}')"><label class="conf-label"><input type="checkbox" id="listConf-${list.id}"> &#128274;</label><button class="add-btn" onclick="addListTask('${list.id}')">+ Add</button></div>`;
    body+=`<div class="notice n-conf">Tasks marked private never appear in any Teams post.</div>`;
  }
  return `<div class="tab-pane${active?' active':''}" id="pane-list-${list.id}">
    <div class="panel"><div class="panel-header">
      <span class="panel-title"><span class="dot" style="background:${color}"></span>${esc(list.name)}<span class="list-type-badge">${list.type==='ongoing'?'ongoing':'to-do'}</span></span>
      <div class="header-btns"><button class="hdr-btn" onclick="renameList('${list.id}')">Rename</button><button class="hdr-btn" onclick="deleteList('${list.id}')" style="color:var(--red);border-color:var(--red)">Delete</button></div>
    </div><div class="section">${body}</div></div></div>`;
}
function renderListPanes(){
  var container=document.getElementById('listPanesContainer');
  container.innerHTML=lists.map(function(l,i){return buildListPaneHtml(l,colorForList(i));}).join('');
}

function genMorning(){var t=tasks.filter(function(x){return x.bucket==='today'&&!x.confidential});var p='Good morning, today I will be WFO and;\n\n';t.length?t.forEach(function(x){p+='\u2022 '+x.text+'\n'}):(p+='\u2022 (to be added)\n');return p.trim();}
function genEod(){var done=tasks.filter(function(t){return(t.bucket==='today'||t.bucket==='new')&&t.done&&!t.confidential});var notDone=tasks.filter(function(t){return t.bucket==='today'&&!t.done&&!t.confidential});var added=tasks.filter(function(t){return t.bucket==='new'&&!t.confidential});var p='Today I have:\n\n';if(done.length){p+='Completed:\n';done.forEach(function(t){p+='\u2022 '+t.text+' (done)\n'});}if(added.length){p+='\nAdded today:\n';added.forEach(function(t){p+='\u2022 '+t.text+(t.done?' (done)':'')+'\n'});}if(notDone.length){p+='\nCarrying forward:\n';notDone.forEach(function(t){p+='\u2022 '+t.text+'\n'});}if(!done.length&&!notDone.length&&!added.length)p+='(No tasks recorded today)\n';p+='\nI hope everyone has a lovely evening!';return p.trim();}
function genTomorrow(){var t=tasks.filter(function(x){return x.bucket==='tomorrow'&&!x.confidential});var p='Good morning, today I will be WFO and;\n\n';t.length?t.forEach(function(x){p+='\u2022 '+x.text+'\n'}):(p+='\u2022 (add tasks in the Tomorrow tab)\n');return p.trim();}

async function copyPost(which){
  var text=which==='morning'?genMorning():which==='eod'?genEod():genTomorrow();
  var btnId=which==='morning'?'morningCopyBtn':which==='eod'?'eodCopyBtn':'tomorrowCopyBtn';
  await navigator.clipboard.writeText(text);var btn=document.getElementById(btnId);var orig=btn.textContent;
  btn.textContent='Copied!';btn.classList.add('copied');setTimeout(function(){btn.textContent=orig;btn.classList.remove('copied');},2000);
}
function updateStats(){
  document.getElementById('statToday').textContent=tasks.filter(function(t){return t.bucket==='today'||t.bucket==='new'}).length;
  document.getElementById('statDone').textContent=tasks.filter(function(t){return t.done}).length;
  document.getElementById('statTmrw').textContent=tasks.filter(function(t){return t.bucket==='tomorrow'}).length;
  var checklistIds=lists.filter(function(l){return l.type==='checklist'}).map(function(l){return l.id});
  document.getElementById('statBacklog').textContent=tasks.filter(function(t){return checklistIds.indexOf(t.bucket)!==-1}).length;
}
function render(){
  renderTaskList('todayList','today');
  renderTaskList('newList','new');
  renderTaskList('tomorrowList','tomorrow');
  renderListTabs();
  renderListPanes();
  document.getElementById('morningPost').textContent=genMorning();
  document.getElementById('eodPost').textContent=genEod();
  document.getElementById('tomorrowPost').textContent=genTomorrow();
  updateStats();
}

async function boot(){
  try{
    var res=await sb.auth.getSession();
    if(res.data&&res.data.session&&res.data.session.user){
      document.getElementById('loadingOverlay').style.display='none';
      document.getElementById('appScreen').style.display='block';
      loadData();return;
    }
  }catch(e){console.warn('Session check failed:',e);}
  document.getElementById('loadingOverlay').style.display='none';
  var stored=localStorage.getItem(PIN_STORE);
  if(!stored){document.getElementById('pinSubtitle').textContent='Choose a 4-digit PIN to get started';document.getElementById('pinMsg').textContent="You'll use this on every device.";}
  document.getElementById('authScreen').style.display='block';
}
boot();
</script>
